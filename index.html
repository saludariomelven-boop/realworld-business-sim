<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111714">
  <meta name="application-version" content="RW-LAYER-8.3.1 · Secretary Panel Scroll Fix · 2026-10-14">
  <meta name="description" content="REALWORLD business simulation with free company-aware secretary tools, private local notes, and optional on-device AI.">
  <title>REALWORLD — Business Simulation</title>
  <style>
    :root{color-scheme:dark;--bg:#111714;--panel:#19211e;--line:#344039;--text:#edf2eb;--muted:#aab5aa;--accent:#bad5a6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,560px);padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
    .mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent);color:#1f3022;font-weight:900;font-size:23px}
    h1{font-size:23px;line-height:1.2;margin:18px 0 8px}p{color:var(--muted);margin:0 0 14px}.track{height:5px;border-radius:99px;background:#2d3a32;overflow:hidden;margin:18px 0}.track span{display:block;height:100%;width:40%;background:var(--accent);animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{width:95%}}
    button{display:none;border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#1f3022;font:inherit;font-weight:800;cursor:pointer}.error .track{display:none}.error button{display:inline-block}@media(prefers-reduced-motion:reduce){.track span{animation:none;width:70%}}
  </style>
</head>
<body>
  <main id="boot-status" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">R</div>
    <h1>Opening REALWORLD</h1>
    <p>Loading the preserved simulation and Layer 8.3.1 Business Secretary scroll fix.</p>
    <div class="track" aria-hidden="true"><span></span></div>
    <button id="boot-retry" type="button">Try again</button>
  </main>
  <script>
  (function realworldLayer83Boot(){
    'use strict';
    // The business engine remains pinned to the exact accepted Layer 6.0 source.
    // All add-ons load in the same page origin so existing browser saves remain available.
    const ENGINE_URL = 'https://raw.githubusercontent.com/saludariomelven-boop/realworld-business-sim/cca64607926733ee0d1130138606b2753a67dd99/index.html';
    const PAGES_BASE = 'https://saludariomelven-boop.github.io/realworld-business-sim/';
    const status = document.getElementById('boot-status');
    const retry = document.getElementById('boot-retry');
    let busy = false;

    function showError(){
      if(status){
        status.classList.add('error');
        const title=status.querySelector('h1');
        const copy=status.querySelector('p');
        if(title)title.textContent='REALWORLD could not load';
        if(copy)copy.textContent='The preserved game source could not be reached. Check your connection, then retry. This loader does not change your previous browser save.';
      }
      busy=false;
    }

    async function start(){
      if(busy)return;
      busy=true;
      if(status){status.classList.remove('error');const h=status.querySelector('h1');const p=status.querySelector('p');if(h)h.textContent='Opening REALWORLD';if(p)p.textContent='Loading the preserved simulation and Layer 8.3.1 Business Secretary scroll fix.';}
      try{
        const response=await fetch(ENGINE_URL,{mode:'cors',credentials:'omit',cache:'no-store'});
        if(!response.ok)throw new Error('Pinned game source returned HTTP '+response.status);
        let html=await response.text();
        if(!html.includes('REALWORLD_BUILD_ID: RW-LAYER-6.0 | Working Capital & Cash Runway Planning · 2026-10-13'))throw new Error('Pinned game source did not match the expected verified build');
        if(!/<head\b[^>]*>/i.test(html)||!/<\/body\s*>/i.test(html))throw new Error('Pinned game source is incomplete');
        html=html.replace(/<head\b[^>]*>/i,match=>match+'\n<base href="'+PAGES_BASE+'">');
        const layerScripts='<script src="'+PAGES_BASE+'layer7.js"><\/script>\n<script src="'+PAGES_BASE+'layer8.2.js"><\/script>\n<script src="'+PAGES_BASE+'layer8.3.js"><\/script>';
        html=html.replace(/<\/body\s*>/i,layerScripts+'\n</body>');
        if(!html.includes(PAGES_BASE+'layer7.js')||!html.includes(PAGES_BASE+'layer8.2.js')||!html.includes(PAGES_BASE+'layer8.3.js'))throw new Error('The REALWORLD add-on stack could not be attached');
        document.open();
        document.write(html);
        document.close();
      }catch(error){showError();}
    }
    if(retry)retry.addEventListener('click',start);
    start();
  })();
  </script>
</body>
</html>
