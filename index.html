// // Runtime monetary values use two-decimal major-unit amounts in the selected

function moneyToCentavos(value){
 const n=Number(value);if(!Number.isFinite(n)||n===0)return 0;
 // Parse the shortest round-trippable decimal representation so binary floating
 // point cases such as 1.005 and -2.675 round symmetrically to the nearest centavo.
 if(Math.abs(n)>Number.MAX_SAFE_INTEGER/100)return Math.round(n*100);
 const negative=n<0;const text=Math.abs(n).toString().toLowerCase();const parts=text.split('e');const exponent=parts.length>1?Number(parts[1])||0:0;const mantissa=parts[0];const decimal=mantissa.split('.');const fraction=decimal[1]||'';const digits=(decimal[0]+fraction).replace(/^0+(?=\d)/,'')||'0';const shift=2-fraction.length+exponent;let cents=BigInt(digits);
 if(shift>=0)cents*=10n**BigInt(shift);
 else{const divisor=10n**BigInt(-shift);const quotient=cents/divisor;const remainder=cents%divisor;cents=quotient+(remainder*2n>=divisor?1n:0n)}
 const result=Number(cents);return negative?-result:result;

function centavosToMoney(cents){const n=Number(cents);return Number.isFinite(n)?Math.trunc(n)/100:0}

function recordCashFlowEntry(memo,lines){
 if(!game||!game.cashFlowCurrent)return;
 const sum=(account,side)=>centavosToMoney(lines.reduce((a,line)=>a+(line.account===account?moneyToCentavos(line[side]):0),0));
 const cashIn=sum('Cash','debit'),cashOut=sum('Cash','credit');
 const overdraftRepayment=sum('Bank overdraft','debit'),overdraftDraw=sum('Bank overdraft','credit');
 const termLoanIn=sum('Term loan payable','credit'),termLoanOut=sum('Term loan payable','debit');
 const ownerCapitalIn=sum('Owner capital','credit');
 const assetAccounts=/^(equipment|fixed assets?|property|vehicle|machinery|plant|intangible assets?)$/i;
 const assetPurchases=centavosToMoney(lines.filter(x=>assetAccounts.test(x.account)).reduce((a,x)=>a+moneyToCentavos(x.debit||0),0));
 const assetDisposals=centavosToMoney(lines.filter(x=>assetAccounts.test(x.account)).reduce((a,x)=>a+moneyToCentavos(x.credit||0),0));
 const hasSales=sum('Sales revenue','credit')>0;
 const receivableCollection=sum('Accounts receivable','credit');
 const f=game.cashFlowCurrent;
 const add=(key,value)=>{if(Number.isFinite(value)&&Math.abs(moneyToCentavos(value))>0)f[key]=centavosToMoney(moneyToCentavos(f[key]||0)+moneyToCentavos(value))};
 // This is a non-cash reclassification: a delayed processor settlement reverses
 // the earlier assumed receipt instead of pretending money was spent.
 if(/payment processor settlement delay/i.test(memo)){
  add('operatingIn',-Math.min(cashOut,Math.max(0,f.operatingIn||0)));
  return;
 }
 if(termLoanIn>0||ownerCapitalIn>0){
  add('financingIn',termLoanIn+ownerCapitalIn);
  add('financingOut',overdraftRepayment);
  add('financingIn',overdraftDraw);
  return;
 }
 if(termLoanOut>0){
  add('financingOut',termLoanOut);
  add('financingIn',overdraftDraw);
  add('financingOut',overdraftRepayment);
  return;
 }
 if(/loan origination fee/i.test(memo)||lines.some(x=>/financing fee expense/i.test(x.account))){
  add('financingOut',cashOut+overdraftDraw);
  add('financingIn',overdraftDraw);
  add('financingOut',overdraftRepayment);
  return;
 }
 if(assetPurchases>0&&cashOut+overdraftDraw>0){
  add('investingOut',cashOut+overdraftDraw);
  add('financingIn',overdraftDraw);
  add('financingOut',overdraftRepayment);
  return;
 }
 if(assetDisposals>0&&cashIn+overdraftRepayment>0){
  add('investingIn',cashIn+overdraftRepayment);
  add('financingOut',overdraftRepayment);
  add('financingIn',overdraftDraw);
  return;
 }
 if(hasSales||(receivableCollection>0&&cashIn+overdraftRepayment>0)){
  add('operatingIn',cashIn+overdraftRepayment);
  add('financingOut',overdraftRepayment);
  add('financingIn',overdraftDraw);
  return;
 }
 if(cashOut+overdraftDraw>0){
  add('operatingOut',cashOut+overdraftDraw);
  add('financingIn',overdraftDraw);
  add('financingOut',overdraftRepayment);
  return;
 }
 if(cashIn+overdraftRepayment>0){
  add('operatingIn',cashIn+overdraftRepayment);
  add('financingOut',overdraftRepayment);
  add('financingIn',overdraftDraw);
 }
}
function cashFlowSummary(){
 const totals=emptyCashFlow();
 for(const row of (game.cashFlowHistory||[]))for(const k of CASH_FLOW_FIELDS)totals[k]=sumMoney([totals[k],row[k]||0]);
 for(const k of CASH_FLOW_FIELDS)totals[k]=sumMoney([totals[k],(game.cashFlowCurrent||emptyCashFlow())[k]||0]);
 const operatingNet=sumMoney([totals.operatingIn,-totals.operatingOut]);
 const investingNet=sumMoney([totals.investingIn,-totals.investingOut]);
 const financingNet=sumMoney([totals.financingIn,-totals.financingOut]);
 const netChange=sumMoney([operatingNet,investingNet,financingNet]);
 const openingCash=Number(game.cashFlowOpeningCash)||0;
 const expectedClosing=sumMoney([openingCash,netChange]);
 return {...totals,operatingNet,investingNet,financingNet,netChange,openingCash,expectedClosing,actualClosing:game.cash,variance:sumMoney([game.cash,-expectedClosing])};
}
function makeEntry(memo,lines){const clean=lines.filter(x=>moneyToCentavos(x.debit||0)!==0||moneyToCentavos(x.credit||0)!==0).map(x=>({account:x.account,debit:roundMoneyValue(x.debit||0),credit:roundMoneyValue(x.credit||0)}));if(!clean.length)return;const dr=sumMoney(clean.map(x=>x.debit)),cr=sumMoney(clean.map(x=>x.credit));if(Math.abs(moneyToCentavos(dr)-moneyToCentavos(cr))>10){console.warn('Unbalanced journal entry',memo,dr,cr);game.integrityWarnings=(game.integrityWarnings||0)+1;}game.journal.unshift({date:game.date,week:game.week,memo,lines:clean,total:Math.max(dr,cr)});if(game.journal.length>600)game.journal.length=600;recordCashFlowEntry(memo,clean);}

function customerDemandMultiplier(product){
 const segments=Array.isArray(game?.customerSegments)&&game.customerSegments.length?game.customerSegments:CUSTOMER_SEGMENT_DEFAULTS;
 const strategy=game?.marketStrategy||'balanced';const relative=product.price/Math.max(1,product.refPrice||product.price);
 const strategic={value:{budget:1.12,mainstream:1.00,quality:0.90},balanced:{budget:1.00,mainstream:1.06,quality:1.00},premium:{budget:0.88,mainstream:0.99,quality:1.14}}[strategy]||{budget:1,mainstream:1,quality:1};
 const total=segments.reduce((a,x)=>a+Math.max(0,Number(x.share)||0),0)||1;
 const raw=segments.reduce((sum,seg)=>{
  const priceAppeal=clamp(1+(1-relative)*(Number(seg.priceSensitivity)||1)*0.10,0.78,1.22);
  const loyaltyAppeal=0.90+clamp(Number(seg.loyalty)||0,0,100)*0.002;
  const qualityAppeal=clamp(1+(Number(product.quality||60)-60)*(Number(seg.qualitySensitivity)||0)*0.0015,0.90,1.10);
  return sum+(Math.max(0,Number(seg.share)||0)/total)*priceAppeal*loyaltyAppeal*qualityAppeal*(strategic[seg.id]||1);
 },0);

}

function advanceCompetitorMarket(seasonFactor=seasonalDemandMultiplier()){
 if(!Array.isArray(game.competitors))game.competitors=clone(COMPETITOR_DEFAULTS);
 const addressableDemand=(game.products||[]).reduce((sum,p)=>sum+Math.max(0,Number(p.baseDemand)||0),0);
 for(const rival of game.competitors){
  // Rivals independently adjust pricing, stock cover, and capacity; reliability affects restocking.
  const drift=Number(rival.priceMomentum)||0;
  rival.priceIndex=clamp((Number(rival.priceIndex)||1)+drift+(Math.random()-.5)*0.008,0.82,1.24);
  const restockChance=clamp(Number(rival.reliability)||0.85,0.4,0.99);
  rival.stockIndex=clamp((Number(rival.stockIndex)||0.8)+(Math.random()<restockChance?0.035:-0.10),0.35,1);
  const targetCapacity=rival.strategy==='premium'?1.08:rival.strategy==='value'?0.96:1.00;
  rival.capacityIndex=clamp((Number(rival.capacityIndex)||targetCapacity)+(targetCapacity-(Number(rival.capacityIndex)||targetCapacity))*.18+(Math.random()-.5)*.018,0.65,1.30);
  const priceAppeal=clamp(1-(rival.priceIndex-1)*0.5,0.78,1.25);
  rival.lastDemandUnits=roundMoneyValue(Math.max(0,addressableDemand*(Number(game.economy)||1)*(Number(seasonFactor)||1)*Math.max(0,Number(rival.marketWeight)||0)*1.20*priceAppeal));
  rival.lastSoldUnits=roundMoneyValue(Math.min(rival.lastDemandUnits,rival.lastDemandUnits*clamp(rival.stockIndex*rival.capacityIndex,0.25,1)));
  rival.lastLostUnits=roundMoneyValue(Math.max(0,rival.lastDemandUnits-rival.lastSoldUnits));
 }
 refreshCompetitorReferencePrices();
}

function supplierById(id){return SUPPLIER_CATALOG.find(x=>x.id===id)||SUPPLIER_CATALOG[1]}
function validatePurchaseOrders(state){
 if(!Array.isArray(state.purchaseOrders)||state.purchaseOrders.length>300)throw new Error('Invalid purchase-order list');
 if(!Number.isInteger(state.purchaseOrderSequence)||state.purchaseOrderSequence<1)throw new Error('Invalid purchase-order sequence');
 const ids=new Set();let openAdvances=0;
 for(const po of state.purchaseOrders){
  if(!isPlainObject(po)||typeof po.id!=='string'||!po.id.trim()||ids.has(po.id))throw new Error('Invalid or duplicate purchase-order ID');ids.add(po.id);
  if(typeof po.productId!=='string'||!state.products.some(x=>x.id===po.productId&&x.kind==='goods'))throw new Error('Purchase order has an invalid product');
  const supplier=SUPPLIER_CATALOG.find(x=>x.id===po.supplierId);if(!supplier||po.supplierName!==supplier.name)throw new Error('Purchase order has an invalid supplier');
  requireFiniteFields(po,['quantity','unitCost','totalCost','cashPaid','payableAmount','placedWeek','etaWeek','delayCount','reliability'],'purchase order');
  if(!Number.isInteger(po.quantity)||po.quantity<1||po.quantity>2000||po.unitCost<=0||po.totalCost<=0||moneyToCentavos(po.totalCost)!==moneyToCentavos(roundMoneyValue(po.quantity*po.unitCost))||po.cashPaid<0||po.payableAmount<0||moneyToCentavos(po.totalCost)!==moneyToCentavos(po.cashPaid)+moneyToCentavos(po.payableAmount))throw new Error('Purchase-order amounts do not reconcile');
  if(!Number.isInteger(po.placedWeek)||po.placedWeek<1||po.placedWeek>state.week||!Number.isInteger(po.etaWeek)||po.etaWeek<po.placedWeek||po.etaWeek>state.week+100||!Number.isInteger(po.delayCount)||po.delayCount<0||po.delayCount>2||po.reliability<0.4||po.reliability>1)throw new Error('Invalid purchase-order schedule');
  if(!['open','received'].includes(po.status))throw new Error('Invalid purchase-order status');
  if(po.status==='open'){if(po.etaWeek<state.week||po.receivedWeek!==null&&po.receivedWeek!==undefined)throw new Error('Invalid open purchase-order timing');openAdvances+=po.cashPaid;}
  if(po.status==='received'&&(!Number.isInteger(po.receivedWeek)||po.receivedWeek<po.placedWeek||po.receivedWeek>state.week||po.etaWeek>po.receivedWeek))throw new Error('Invalid purchase-order receipt date');
 }
 if(moneyToCentavos(roundMoneyValue(openAdvances))!==moneyToCentavos(roundMoneyValue(state.supplierAdvances)))throw new Error('Supplier advances do not reconcile to open purchase orders');
}
function placePurchaseOrder(productId){
 const product=getProduct(productId);if(!product||product.kind!=='goods'){notify('Only stocked goods can be ordered from suppliers.','error');return false}
 if(game.companyStatus==='bankrupt'){notify('A closed company cannot place a purchase order.','error');return false}
 const quantity=Math.round(Number($(`#order-${productId}`)?.value));
 if(!Number.isFinite(quantity)||quantity<1||quantity>2000){notify('Choose an order quantity from 1 to 2,000 units.','error');return false}
 const supplier=supplierById($(`#supplier-${productId}`)?.value||'standard');
 if(game.purchaseOrders.filter(x=>x.status==='open').length>=50){notify('There are already 50 open purchase orders. Receive existing orders before placing more.','error');return false}
 if(game.purchaseOrders.length>=300){notify('The purchase-order register reached its 300-record limit. Export a save before starting a new company or archiving records.','error');return false}
 const unitCost=roundMoneyValue(product.unitCost*supplier.priceFactor);const totalCost=roundMoneyValue(unitCost*quantity);const cashPaid=roundMoneyValue(totalCost*0.70);const payableAmount=roundMoneyValue(totalCost-cashPaid);
 const spend=spendCash(cashPaid);game.supplierAdvances=roundMoneyValue((game.supplierAdvances||0)+cashPaid);
 const lines=[{account:'Supplier advances',debit:cashPaid}];if(spend.cashUsed)lines.push({account:'Cash',credit:spend.cashUsed});if(spend.overdraftDrawn)lines.push({account:'Bank overdraft',credit:spend.overdraftDrawn});
 makeEntry(`Supplier advance — ${supplier.name} / ${product.name}`,lines);
 const po={id:`po-${String(game.purchaseOrderSequence++).padStart(5,'0')}`,productId:product.id,productName:product.name,supplierId:supplier.id,supplierName:supplier.name,quantity,unitCost,totalCost,cashPaid,payableAmount,placedWeek:game.week,etaWeek:game.week+supplier.leadWeeks,status:'open',delayCount:0,reliability:supplier.reliability,receivedWeek:null};
 game.purchaseOrders.push(po);saveGame(true);renderAll();
 notify(`Purchase order ${po.id} placed: ${quantity} ${product.name} due Week ${po.etaWeek}. ${moneyExact(cashPaid)} advance paid; ${moneyExact(payableAmount)} payable on delivery.`,spend.overdraftDrawn?'warn':'');return true;
}

function processSupplierDeliveries(){
 if(!Array.isArray(game.purchaseOrders))game.purchaseOrders=[];
 for(const po of game.purchaseOrders){
  if(po.status!=='open'||po.etaWeek>game.week)continue;
  if(po.delayCount<2&&Math.random()>po.reliability){po.delayCount++;po.etaWeek=game.week+1;addEvent({title:`Supplier delivery delayed — ${po.supplierName}`,icon:'◷',description:`Purchase order ${po.id} for ${po.quantity} ${po.productName} was delayed. Expected receipt moves to Week ${po.etaWeek}; the supplier advance remains an asset and the goods are not added to inventory yet.`,kind:'delivery-delay',impact:'Stock availability risk'});continue;}
  const product=getProduct(po.productId);if(!product)continue;
  product.stockValue=roundMoneyValue(product.stockValue+po.totalCost);product.stock+=po.quantity;product.unitCost=po.unitCost;
  game.supplierAdvances=roundMoneyValue(Math.max(0,(game.supplierAdvances||0)-po.cashPaid));game.ap=roundMoneyValue(game.ap+po.payableAmount);
  const lines=[{account:'Inventory',debit:po.totalCost},{account:'Supplier advances',credit:po.cashPaid}];if(po.payableAmount)lines.push({account:'Accounts payable',credit:po.payableAmount});makeEntry(`Receive supplier order ${po.id} — ${po.supplierName} / ${po.productName}`,lines);
  po.status='received';po.receivedWeek=game.week;
  addEvent({title:`Purchase order received — ${po.productName}`,icon:'▤',description:`${po.supplierName} delivered ${po.quantity} units under ${po.id}. Inventory was capitalized at ${moneyExact(po.totalCost)}; ${moneyExact(po.payableAmount)} is now payable next operating week.`,kind:'delivery',impact:'Stock replenished'});
 }
}
function updateCustomerLoyalty(fulfilment){
 const strategy=game.marketStrategy||'balanced';for(const segment of (game.customerSegments||[])){
  let delta=fulfilment<0.55?-2.2:fulfilment<0.78?-0.8:fulfilment>0.94?0.7:0.15;
  if(strategy==='value'&&segment.id==='budget')delta+=0.35;
  if(strategy==='premium'&&segment.id==='quality')delta+=0.35;
  if(strategy==='value'&&segment.id==='quality')delta-=0.25;
  if(strategy==='premium'&&segment.id==='budget')delta-=0.25;
  segment.loyalty=clamp(roundMoneyValue((Number(segment.loyalty)||55)+delta),0,100);
 }
}

/*

 return `<div class="page-head"><div><div class="eyebrow">Week ${game.week} · ${dateLabel(game.date,'long')}</div><h1>Company dashboard</h1><p>Understand what is happening inside the business before you decide what to do next.</p></div><div class="button-row"><span class="tag ${game.overdraft>0?'bad':game.cash<game.monthlyRent?'warning':'good'}">${game.overdraft>0?'Credit used':game.cash<game.monthlyRent?'Liquidity watch':'Trading active'}</span><button class="secondary-btn small-btn" data-action="export-save">Export save</button></div></div>

 ${game.latestEvent&&game.latestEvent.week===game.week?`<div class="event-banner"><div style="font-size:21px">${game.latestEvent.icon}</div><div><strong>${esc(game.latestEvent.title)}</strong><div class="small" style="color:#c8b99a;margin-top:3px">${esc(game.latestEvent.description)}</div></div></div>`:''}

 <div class="grid three-col section-spacer"><section class="panel"><div class="panel-header"><h3>Economic conditions</h3><span class="tag">Market</span></div><div class="metric-label">Demand index</div><div class="metric-value num">${Math.round(game.economy*100)}<span style="font-size:14px;color:var(--muted)"> / 100</span></div><div class="bar"><span style="width:${clamp(game.economy*100,0,100)}%"></span></div><div class="status-line"><span class="status-dot ${game.economy<.85?'warn':''}"></span>${game.economy>1.04?'Demand is above baseline':game.economy<.9?'Demand is below baseline':'Demand is near baseline'}</div></section><section class="panel"><div class="panel-header"><h3>Balance sheet check</h3><span class="tag ${balanceTag()}">${balanceTag()==='good'?'Balanced':'Review'}</span></div><div class="list-row"><span class="row-title">Total assets</span><span class="row-value num">${money(b.assets,true)}</span></div><div class="list-row"><span class="row-title">Total liabilities</span><span class="row-value num">${money(b.liabilities,true)}</span></div><div class="list-row"><span class="row-title">Book equity</span><span class="row-value num">${money(b.equity,true)}</span></div><div class="small muted" style="margin-top:8px">Assets should equal liabilities plus equity, subject to rounding.</div></section><section class="panel"><div class="panel-header"><h3>Next best action</h3><span class="tag">Decision</span></div><div style="font-weight:800;margin-bottom:6px">${game.cash<game.monthlyRent?'Protect liquidity':game.products.some(p=>p.kind==='goods'&&p.stock<p.baseDemand)?'Check inventory cover':game.employees.length===0?'Review whether hiring pays back':'Review price and margin'}</div><p class="small">${game.cash<game.monthlyRent?'Avoid discretionary spending until you understand the next obligations and expected collections.':game.products.some(p=>p.kind==='goods'&&p.stock<p.baseDemand)?'A stockout costs sales and can weaken customer trust. Check supplier lead time ck" data-id="${p.id}" ${(game.purchaseOrders||[]).length>=300?'disabled':''}>${(game.purchaseOrders||[]).length>=300?'Order register full':'Place purchase order'}</button>`:`<div class="field"><label>Service type</label><input disabled value="Capacity-limited"></div><button class="secondary-btn small-btn" data-action="service-info" data-id="${p.id}">View economics</button>`}</div><div class="form-actions"><button class="primary-btn small-btn" data-action="save-price" data-id="${p.id}">Save selling price</button></div>${p.kind==='goods'&&p.stock<Math.max(5,p.baseDemand*.7)?'<div class="status-line"><span class="status-dot warn"></span>Low stock: consider supplier lead times.</div>':''}</article>`}).join('')}</div>
 <div class="grid two-col section-spacer">${!game.products.some(p=>p.kind==='goods')?`<section class="panel"><div class="panel-header"><h3>Service delivery planning</h3><span class="tag">No physical stock</span></div><p class="small">Digital Agency offers are capacity-limited services, so physical-goods supplier purchase orders are not used for this industry. Manage delivery capacity, pricing, staffing, and customer receivables instead.</p><div class="list-row"><span class="row-title">Active service offers</span><span class="row-value num">${game.products.filter(p=>p.kind==='service').length}</span></div><div class="list-row"><span class="row-title">Purchase orders</span><span class="row-value num">Not applicable</span></div></section>`:`<section class="panel"><div class="panel-header"><h3>Supplier catalog</h3><span class="tag">Modeled offers</span></div><div class="list">${SUPPLIER_CATALOG.map(s=>`<div class="list-row"><div><div class="row-title">${esc(s.name)}</div><div class="row-sub">${s.leadWeeks} week${s.leadWeeks===1?'':'s'} lead · ${Math.round(s.reliability*100)}% modeled on-time reliability</div><div class="row-sub">${esc(s.description)}</div></div><div class="row-value num">${pct(s.priceFactor-1,0)}<div class="tiny muted">vs baseline cost</div></div></div>`).join('')}</div><div class="list-row"><span><span class="row-title">Advance on order</span><div class="row-sub">Recorded as a supplier-advance asset until delivery</div></span><span class="row-value">70%</span></div><div class="list-row"><span><span class="row-title">Balance after delivery</span><div class="row-sub">Recorded as accounts payable, normally settled next week</div></span><span class="row-value">30%</span></div><p class="footnote">Quotes and reliability are simulation assumptions, not offers from real suppliers. Delays are bounded to two extra weeks.</p></section>`}<section class="panel"><div class="panel-header"><h3>Capacity & quality</h3><span class="tag">Operations</span></div><div class="list-row"><span class="row-title">Owner baseline capacity</span><span class="row-value num">${fmtNum(cfg.baseCapacity)}</span></div><div class="list-row"><span class="row-title">Employee capacity</span><span class="row-value num">+${fmtNum(game.employees.reduce((a,e)=>a+e.capacity,0))}</span></div><div class="list-row"><span class="row-title">Customer reputation</span><span class="row-value num">${Math.round(game.reputation)} / 100</span></div><div class="bar"><span style="width:${game.reputation}%"></span></div><div class="status-line">${game.reputation>=75?'Service reliability is a competitive advantage.':game.reputation>=50?'Consistent fulfilment can grow trust.':'Low trust makes customer acquisition harder.'}</div></section></div>
 ${game.products.some(p=>p.kind==='goods')&&game.products.some(p=>p.kind==='service')?`<section class="panel section-spacer"><div class="panel-header"><h3>Service delivery planning</h3><span class="tag">Mixed operating model</span></div><p class="small">Service offers earn revenue through available labour and operating capacity; physical-goods offers use inventory and supplier purchase orders. Both share this company’s cash, staff, and financial statements.</p><div class="list">${game.products.filter(p=>p.kind==='service').map(p=>`<div class="list-row"><span><span class="row-title">${esc(p.name)}</span><div class="row-sub">${esc(p.description)}</div></span><span class="row-value num">${fmtNum(p.baseDemand)} jobs / week</span></div>`).join('')}</div></section>`:''}
 <div class="panel section-spacer"><div class="panel-header"><div><h3>Purchase-order register</h3><div class="small muted">Open orders keep their advances separate from on-hand inventory.</div></div><span class="tag">${openOrders.length} open · ${(game.purchaseOrders||[]).length} / 300 total</span></div><div class="list-row"><span class="row-title">Supplier advances tied to open orders</span><span class="row-value num">${moneyExact(game.supplierAdvances||0)}</span></div>${recentOrders.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Order / item</th><th>Supplier</th><th>Status</th><th class="right">Qty</th><th class="right">Expected week</th><th class="right">Total cost</th><th class="right">Advance</th><th class="right">Balance</th></tr></thead><tbody>${recentOrders.map(po=>`<tr><td><strong>${esc(po.id)}</strong><div class="small muted">${esc(po.productName)}</div></td><td>${esc(po.supplierName)}</td><td><span class="tag ${po.status==='received'?'good':'warning'}">${po.status==='received'?`Received W${po.receivedWeek}`:`ETA W${po.etaWeek}${po.delayCount?` · delayed ${po.delayCount}×`:''}`}</span></td><td class="right num">${po.quantity}</td><td class="right num">${po.etaWeek}</td><td class="right num">${moneyExact(po.totalCost)}</td><td class="right num">${moneyExact(po.cashPaid)}</td><td class="right num">${moneyExact(po.payableAmount)}</td></tr>`).join('')}</tbody></table></div>`:game.products.every(p=>p.kind==='service')?'<div class="empty-state">Physical-goods purchase orders do not apply to service-only businesses.</div>':'<div class="empty-state">No purchase orders yet. Choose a supplier and place an order on a stocked product.</div>'}<p class="footnote">Supplier deposits are not expensed when paid. On receipt, stock is capitalized at order cost and the unpaid 30% becomes an accounts-payable balance.</p></div>`}

function renderMarket(){const demandFactor=1+Math.sqrt(Math.max(0,game.marketingBudget)/Math.max(1,game.baselineMarketing))*.12;const season=seasonalOutlook();const seasonFactor=season.factor;const d=clamp(game.economy*(.68+game.reputation/190)*demandFactor*seasonFactor*marketStrategyMultiplier(),.35,1.85);const segments=(game.customerSegments||CUSTOMER_SEGMENT_DEFAULTS);const rivals=(game.competitors||COMPETITOR_DEFAULTS);const strategyLabel=(x)=>x==='value'?'Value pricing':x==='premium'?'Premium positioning':'Balanced positioning';return `<div class="page-head"><div><div class="eyebrow">Market · customers · competitors</div><h1>Market & sales</h1><p>Demand now combines macro conditions, customer segment preferences, market positioning, competitor price and availability signals, and predictable seasonal cycles. More demand can still be unprofitable when contribution margins are weak.</p></div><span class="tag">Simulated market · Week ${game.week}</span></div>
 <div class="grid four-col stats-grid">${metric('Demand conditions',Math.round(game.economy*100)+'/100',game.economy>1.04?'Above baseline':game.economy<.9?'Below baseline':'Near baseline','↗',game.economy<.88?'warn':'')}${metric('Estimated demand factor',d.toFixed(2)+'×','Includes market strategy and seasonality','◈')}${metric('Customer reputation',Math.round(game.reputation)+'/100','Service and fulfilment trust','★')}${metric('Seasonal outlook',`${season.factor.toFixed(2)}×`,`${season.monthName} · ${season.name}`,'▦',season.factor>=1.1?'positive':season.factor<.98?'warn':'')}</div>
 <div class="grid two-col section-spacer"><section class="panel"><div class="panel-header"><h3>Market positioning</h3><span class="tag">Management choice</span></div><p class="small">Choose which customer group to prioritize. The choice changes demand weights and influences loyalty over time; it does not guarantee profit.</p><form data-form="market-strategy"><div class="field"><label for="market-strategy">Positioning strategy</label><select id="market-strategy"><option value="value" ${game.marketStrategy==='value'?'selected':''}>Value pricing — emphasize affordability</option><option value="balanced" ${game.marketStrategy==='balanced'?'selected':''}>Balanced — serve the mainstream</option><option value="premium" ${game.marketStrategy==='premium'?'selected':''}>Premium — emphasize quality and trust</option></select></div><div class="callout" style="margin-top:12px"><strong>Current strategy: ${strategyLabel(game.marketStrategy)}</strong><div class="small muted" style="margin-top:5px">This affects the segment-weighted demand estimate and weekly loyalty changes. Your actual selling price and ability to fulfil demand still matter.</div></div><div class="form-actions"><button class="primary-btn" type="submit">Apply market strategy</button></div></form><div class="divider"></div><div class="list-row"><span class="row-title">Seasonal demand factor</span><span class="row-value num">${season.factor.toFixed(2)}×</span></div><div class="list-row"><span class="row-title">Seasonal phase</span><span class="row-value">${season.name}</span></div><p class="footnote">Seasonality is a repeatable gameplay pattern by calendar month and industry, not a forecast of real demand in your location.</p></section><section class="panel"><div class="panel-header"><h3>Customer segments</h3><span class="tag">Estimated mix</span></div><div class="list">${segments.map(seg=>{const strategyBoost=game.marketStrategy==='value'&&seg.id==='budget'?1.12:game.marketStrategy==='premium'&&seg.id==='quality'?1.1 function renderFixedAssetPanel(){

  return `<tr><td><strong>${esc(a.name)}</strong><div class="small muted">${esc(FIXED_ASSET_CATEGORIES[a.category]||a.category)}${a.isLegacyPool?' · migrated aggregate':''}</div></td><td>${a.isLegacyPool?'Legacy aggregate · original date unavailable':`${dateLabel(a.purchaseDate)}${a.purchaseWeek===0?' · opening':` · W${a.purchaseWeek}`}`}</td><td class="right num">${moneyExact(a.cost)}</td><td class="right num">${moneyExact(a.accumDep)}</td><td class="right num">${moneyExact(displayedBookValue)}</td><td>${status}<div style="margin-top:7px">${statusDetail}</div></td></tr>`;
 }).join('');
 return `<div class="panel section-spacer"><div class="panel-header"><div><h3>Fixed-asset register</h3><div class="small muted">Individual assets · capital investment · sales and disposal</div></div><span class="tag">${active.length} active / ${all.length} total</span></div><div class="kpi-pair"><div class="mini-kpi"><div class="label">Active assets at cost</div><div class="value num">${moneyExact(game.equipment)}</div></div><div class="mini-kpi"><div class="label">Active assets · net book value</div><div class="value num">${moneyExact(businessNetBookValue())}</div></div></div><p class="footnote" style="margin-top:10px">Assets use a simplified 6% annual straight-line depreciation assumption with no residual value. Existing saves migrate their previous equipment pool into one labelled legacy record; old purchases are not fabricated as individual items.</p><div class="divider"></div><h3>Purchase a fixed asset</h3><form data-form="fixed-asset-purchase"><div class="form-row"><div class="field"><label for="fixed-asset-purchase-name">Asset name</label><input id="fixed-asset-purchase-name" type="text" minlength="2" maxlength="80" placeholder="e.g. Delivery van" required></div><div class="field"><label for="fixed-asset-purchase-category">Asset category</label><select id="fixed-asset-purchase-category">${categoryOptions}</select></div></div><div class="field" style="margin-top:12px"><label for="fixed-asset-purchase-amount">Purchase price (${game.currencyCode})</label><input id="fixed-asset-purchase-amount" type="number" min="${localModelAmount(5000)}" max="${Math.max(0,Math.floor(game.cash))}" step="0.01" value="${Math.round(Math.min(localModelAmount(50000),Math.max(0,game.cash)))}" required></div><div class="small muted">Available cash: ${moneyExact(game.cash)}. Purchases use cash only and cannot silently create an overdraft.</div><div class="form-actions"><button type="submit" class="primary-btn" ${game.cash<localModelAmount(5000)?'disabled':''}>Purchase asset</button></div></form><div class="divider"></div><h3>Sell or dispose of an asset</h3><form id="asset-disposal-form" data-form="asset-disposal"><div class="form-row"><div class="field"><label for="asset-disposal-id">Active asset</label><select id="asset-disposal-id" required ${active.length?'':'disabled'}>${assetOptions||'<option value="">No active assets</option>'}</select></div><div class="field"><label for="asset-disposal-proceeds">Sale proceeds (${game.currencyCode})</label><input id="asset-disposal-proceeds" type="number" min="0" max="${localModelAmount(100000000)}" step="0.01" value="0" required ${active.length?'':'disabled'}></div></div><div class="small muted" style="margin-top:9px">Enter ${moneyExact(0)} for a write-off or disposal with no proceeds. Sale proceeds are recorded as investing inflow; any gain or loss is recognized against the asset’s net book value. Gain tax is reserved immediately using the current illustrative tax assumption.</div><div class="form-actions"><button type="submit" class="danger-btn" ${active.length?'':'disabled'}>Confirm sale / disposal</button></div></form><div class="divider"></div><h3>Asset history</h3>${all.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Asset / category</th><th>Acquired</th><th class="right">Cost</th><th class="right">Accumulated depreciation</th><th class="right">Book value*</th><th>Status / action</th></tr></thead><tbody>${rows}</tbody></table></div><div class="footnote" style="margin-top:10px">*For disposed assets, book value shows the net book value immediately before disposal. Purchase/disposal activity is preserved in the register and journal.</div>`:'<div class="empty-state">No fixed assets are registered.</div>'}</div>`;

function renderLoanPortfolio(){
 const loans=Array.isArray(game.loans)?game.loans:[];
 if(loans.length<=1)return '';
 const fmtStatus=(s)=>String(s||'none').replace(/_/g,' ');
 const statusCounts=loans.reduce((counts,l)=>{const key=String(l.loanStatus||'none');if(Object.prototype.hasOwnProperty.call(counts,key))counts[key]++;return counts;},{current:0,past_due:0,defaulted:0,paid_off:0});
 return `<section class="panel section-spacer"><div class="panel-header"><div><h3>Concurrent loan portfolio</h3><div class="small muted">Each facility maintains its own repayment schedule, arrears, late fees, and default record.</div></div><span class="tag">${loans.length} / 20 recorded loans</span></div>
 <p class="footnote" data-testid="loan-portfolio-health">Portfolio health: ${statusCounts.current} current · ${statusCounts.past_due} past due · ${statusCounts.defaulted} defaulted · ${statusCounts.paid_off} paid off. Each facility has an independent schedule and distress status.</p>
 <div class="grid two-col">${loans.map((l,index)=>{
  const due=roundMoneyValue((l.loanBalance||0)+(l.loanInterestPayable||0)+(l.loanLateFeesPayable||0));
  const needsCure=(l.loanArrears>0.01||l.loanInterestPayable>0.01||l.loanLateFeesPayable>0.01||l.loanStatus==='past_due'||l.loanStatus==='defaulted');
  const statusClass=l.loanStatus==='current'||l.loanStatus==='paid_off'?'good':l.loanStatus==='defaulted'?'bad':'warning';
  const statusNote=l.loanStatus==='defaulted'?'Defaulted: scheduled installments are suspended. Outstanding principal, arrears, interest, and fees remain liabilities. Debt payments can still be made against this facility.':l.loanStatus==='past_due'?'Past due: this facility must be cured separately. Payments to another loan do not clear its arrears.':l.loanStatus==='current'?'Scheduled repayments are active for this facility.':l.loanStatus==='paid_off'?'Paid off: no scheduled installments remain.':'';
  const repayId=`loan-repay-${l.id}`;const cureId=`loan-arrears-amount-${l.id}`;
  return `<article class="panel" style="background:#11171e"><div class="panel-header"><div><h3>${esc(l.name||`Term Loan ${index+1}`)}</h3><div class="small muted">${esc(l.lender||'Simulated lender')} · originated Week ${l.createdWeek}</div></div><span class="tag ${statusClass}">${esc(fmtStatus(l.loanStatus))}</span></div>

  <p class="footnote loan-status-note" data-loan-status-note="${esc(l.id)}">${esc(statusNote)}</p>
  ${l.loanBalance>0.009&&!needsCure?`<form data-form="loan-repayment" data-loan-id="${esc(l.id)}" style="margin-top:12px"><div class="field"><label for="${repayId}">Extra principal payment (${game.currencyCode})</label><input id="${repayId}" name="amount" data-loan-amount="principal" type="number" min="0.01" max="${Math.max(0,game.cash)}" step="0.01" value="${Math.min(game.cash,Math.min(l.loanBalance,localModelAmount(10000))).toFixed(2)}" ${game.cash<=0?'disabled':''}></div><button class="secondary-btn" type="submit" ${game.cash<=0?'disabled':''}>Repay this loan</button></form>`:''}
  ${needsCure?`<form data-form="loan-arrears-payment" data-loan-id="${esc(l.id)}" style="margin-top:12px"><div class="field"><label for="${cureId}">Pay this loan from available cash (${game.currencyCode})</label><input id="${cureId}" name="amount" data-loan-amount="cure" type="number" min="0.01" max="${Math.max(0,game.cash)}" step="0.01" value="${Math.min(game.cash,due).toFixed(2)}" ${game.cash<=0?'disabled':''}></div><button class="secondary-btn" type="submit" ${game.cash<=0?'disabled':''}>Pay this loan's overdue debt</button><p class="footnote">Payment order for this loan: late fees → term-loan interest → principal. No overdraft is created for a shortfall.</p></form>`:''}
  </article>`;
 }).join('')}</div><p class="footnote">Portfolio totals above are aggregate compatibility values; these cards are the authoritative per-loan view. A default on one facility does not change the status or schedule of another facility.</p></section>`;
}

function renderCountryRulebook(){

 const tasks=[
  {id:'formation',title:'Review entity setup & permits',points:5,icon:'▣',item:rules.formation},
  {id:'tax',title:'Review tax registration & records',points:4,icon:'▤',item:rules.tax},
  {id:'employment',title:'Review employment & payroll',points:4,icon:'♙',item:rules.employment}
 ];
 const completed=Array.isArray(game.countryRuleTasks)?game.countryRuleTasks:[];
 return `<section class="panel section-spacer"><div class="panel-header"><div><h3>Country rules registry</h3><p class="small" style="margin-top:5px">${esc(rules.country)} · Official-source starting points · reviewed ${COUNTRY_RULEBOOK_REFERENCE_DATE}</p></div><span class="tag">${completed.length}/3 tasks logged</span></div><p class="small">${esc(rules.scope)}</p><div class="grid three-col">${tasks.map(task=>{const done=completed.includes(task.id);return `<article class="product-card"><div class="panel-header"><strong>${task.icon} ${esc(task.item.title)}</strong><span class="tag ${done?'good':'warning'}">${done?'Reviewed':'To review'}</span></div><p class="small">${esc(task.item.summary)}</p><p class="small"><a href="${esc(task.item.url)}" target="_blank" rel="noopener noreferrer">${esc(task.item.source)} ↗</a></p><button class="${done?'secondary-btn':'primary-btn'} small-btn" data-action="complete-country-task" data-task="${task.id}" ${done?'disabled':''}>${done?'Review logged':`Log review (+${task.points} readiness)`}</button></article>`}).join('')}</div><div class="callout warning" style="margin-top:14px"><strong>Scope boundary:</strong> These are official starting points, not a complete legal opinion. Exact duties can depend on legal form, city/state/province, sector, revenue and staff. Logging a task only changes the game’s readiness score; it does not submit a registration, file tax, satisfy employment law or certify compliance. REALWORLD still uses an illustrative tax reserve and illustrative wages.</div></section>`;
}
function completeCountryRuleTask(task){
 if(!game||!['formation','tax','employment'].includes(task)){notify('Unknown country-rule task.','error');return}
 if(!Array.isArray(game.countryRuleTasks))game.countryRuleTasks=[];
 if(game.countryRuleTasks.includes(task)){notify('This review is already logged.');return}
 const points={formation:5,tax:4,employment:4}[task];
 game.countryRuleTasks.push(task);game.complianceScore=clamp(game.complianceScore+points,0,100);
 saveGame(true);renderAll();notify(`In-game ${task} review logged. Readiness +${points}; this is not a real-world filing.`);
}

ass="tag">Exposure indicators</span></div><div style="margin-bottom:16px"><div class="list-row"><span class="row-title">Cash pressure</span><span class="row-value ${cashStress?'warn':'positive'}">${cashStress?'Elevated':'Manageable'}</span></div><div class="risk-meter">${Array.from({length:5},(_,i)=>`<span class="${i<(cashStress?4:2)?'on '+(cashStress?'warn':''):''}"></span>`).join('')}</div></div><div style="margin-bottom:16px"><div class="list-row"><span class="row-title">Uncovered operating risk</span><span class="row-value ${game.insuranceActive?'positive':'warn'}">${game.insuranceActive?'Lower':'Uninsured'}</span></div><div class="risk-meter">${Array.from({length:5},(_,i)=>`<span class="${i<(game.insuranceActive?1:3)?'on '+(game.insuranceActive?'':'warn'):''}"></span>`).join('')}</div></div><div style="margin-bottom:16px"><div class="list-row"><span class="row-title">Accounting discipline</span><span class="row-value ${game.bookkeeper?'positive':'warn'}">${game.bookkeeper?'Supported':'Owner-managed'}</span></div><div class="risk-meter">${Array.from({length:5},(_,i)=>`<span class="${i<(game.bookkeeper?1:3)?'on '+(game.bookkeeper?'':'warn'):''}"></span>`).join('')}</div></div><div class="callout warning"><strong>Important:</strong> This prototype does not file actual taxes, register a real company, issue legally binding employment contracts, or verify government compliance. It is a management simulation, not a legal or accounting service.</div></section></div>

function renderCashFlowStatement(){
 const f=cashFlowSummary();
 const display=v=>`${v<0?'−':''}${moneyExact(Math.abs(v))}`;
 const rows=[
  ['Operating activities','Cash received from customers',f.operatingIn],
  ['Operating activities','Operating cash payments',-f.operatingOut],
  ['Operating activities','Net cash from operating activities',f.operatingNet,'strong'],
  ['Investing activities','Asset purchases',-f.investingOut],
  ['Investing activities','Asset sale proceeds',f.investingIn],
  ['Investing activities','Net cash from investing activities',f.investingNet,'strong'],
  ['Financing activities','Owner contributions, term loans and overdraft draws',f.financingIn],
  ['Financing activities','Principal repayments, overdraft repayments and financing fees',-f.financingOut],
  ['Financing activities','Net cash from financing activities',f.financingNet,'strong'],
  ['Cash reconciliation','Net change in cash',f.netChange,'strong'],
  ['Cash reconciliation','Cash at start of tracking period',f.openingCash],
  ['Cash reconciliation','Expected closing cash',f.expectedClosing,'strong'],
  ['Cash reconciliation','Actual available cash',f.actualClosing,'strong'],
  ['Cash reconciliation','Reconciliation variance',f.variance,'strong']
 ];
 const rowsHtml=rows.map((r,i)=>`<tr>${i===0||rows[i-1][0]!==r[0]?`<td class="eyebrow">${r[0]}</td>`:'<td></td>'}<td class="${r[3]==='strong'?'strong':''}">${r[1]}</td><td class="right num ${r[2]<-.01?'negative':r[2]>.01&&r[3]==='strong'?'positive':''}">${display(r[2])}</td></tr>`).join('');
 const trackedAscending=(game.cashFlowHistory||[]).slice().sort((a,b)=>a.week-b.week);
 let rollingCash=Number(game.cashFlowOpeningCash)||0;
 const trackedPeriods=trackedAscending.map(x=>{const net=cashFlowNet(x);const opening=typeof x.openingCash==='number'?x.openingCash:rollingCash;const closing=typeof x.closingCash==='number'?x.closingCash:roundMoneyValue(opening+net);const variance=typeof x.variance==='number'?x.variance:roundMoneyValue(closing-(opening+net));rollingCash=closing;return {...x,periodOpeningCash:opening,periodClosingCash:closing,periodVariance:variance,periodNet:net}}).reverse();
 const recent=cashFlowExpanded?trackedPeriods:trackedPeriods.slice(0,8);
 const currentPeriodNet=cashFlowNet(game.cashFlowCurrent||emptyCashFlow());
 const currentPeriodOpening=Number.isFinite(game.cashFlowPeriodOpeningCash)?game.cashFlowPeriodOpeningCash:roundMoneyValue(game.cash-currentPeriodNet);
 const currentPeriodVariance=roundMoneyValue(game.cash-(currentPeriodOpening+currentPeriodNet));
 const trackingNote=game.cashFlowMigrated?`This existing save was upgraded at Week ${game.cashFlowOpeningWeek} (${dateLabel(game.cashFlowOpeningDate)}). Available cash at upgrade is the opening baseline; earlier transactions and historical cash flows were not reconstructed.`:game.cashFlowOpeningWeek>1?`Tracking begins at Week ${game.cashFlowOpeningWeek} (${dateLabel(game.cashFlowOpeningDate)}). Earlier saved periods were not reconstructed because older saves did not retain classified cash flows.`:'The opening cash balance is the available cash after initial company setup. Cash-flow categories are tracked from the first operating period.';
 return `<div class="panel section-spacer"><div class="panel-header"><div><h3>Statement of cash flows · direct method</h3><div class="small muted">${game.cashFlowHistory.length?`Tracking from Week ${game.cashFlowOpeningWeek} · ${game.cashFlowHistory.length} closed periods`:'No closed periods tracked yet'}${Object.values(game.cashFlowCurrent||{}).some(v=>v>0)?' · includes unclosed period activity':''}</div></div><span class="tag ${Math.abs(f.variance)<1?'good':'warning'}">${Math.abs(f.variance)<1?'Reconciled':'Review variance'}</span></div><p class="small muted">${trackingNote} Customer receipts and operating payments are classified from posted journal entries. Non-cash accruals are excluded; loan principal is financing, not an expense.</p><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Section</th><th>Cash-flow item</th><th class="right">${game.currencyCode}</th></tr></thead><tbody>${rowsHtml}</tbody></table></div><div class="divider"></div><div class="panel-header"><div><h3>Cash flow by period</h3><div class="small muted">Opening cash, activity by category, net movement, and closing cash.</div></div><button type="button" class="secondary-btn small-btn" data-action="toggle-cashflow-history">${cashFlowExpanded?'Show latest 8':`Show all ${trackedPeriods.length} periods`}</button></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Period</th><th>Date</th><th class="right">Opening cash</th><th class="right">Operating</th><th class="right">Investing</th><th class="right">Financing</th><th class="right">Net change</th><th class="right">Closing cash</th><th class="right">Variance</th></tr></thead><tbody><tr><td>W${game.week} · In progress</td><td>${dateLabel(game.date)}</td><td class="right num">${display(currentPeriodOpening)}</td><td class="right num">${display((game.cashFlowCurrent?.operatingIn||0)-(game.cashFlowCurrent?.operatingOut||0))}</td><td class="right num">${display((game.cashFlowCurrent?.investingIn||0)-(game.cashFlowCurrent?.investingOut||0))}</td><td class="right num">${display((game.cashFlowCurrent?.financingIn||0)-(game.cashFlowCurrent?.financingOut||0))}</td><td class="right num ${currentPeriodNet>=0?'positive':'negative'}">${display(currentPeriodNet)}</td><td class="right num">${display(game.cash)}</td><td class="right num ${Math.abs(currentPeriodVariance)<1?'positive':'negative'}">${display(currentPeriodVariance)}</td></tr>${recent.map(x=>`<tr><td>W${x.week}</td><td>${dateLabel(x.date)}</td><td class="right num">${display(x.periodOpeningCash)}</td><td class="right num">${display(x.operatingIn-x.operatingOut)}</td><td class="right num">${display(x.investingIn-x.investingOut)}</td><td class="right num">${display(x.financingIn-x.financingOut)}</td><td class="right num ${x.periodNet>=0?'positive':'negative'}">${display(x.periodNet)}</td><td class="right num">${display(x.periodClosingCash)}</td><td class="right num ${Math.abs(x.periodVariance)<1?'positive':'negative'}">${display(x.periodVariance)}</td></tr>`).join('')}</tbody></table></div>${trackedPeriods.length?`<p class="footnote">Showing ${recent.length} of ${trackedPeriods.length} closed periods. Each stored period carries its actual cash baseline and closing balance; historical rows from earlier versions use reconstructed balances based on the recorded cash-flow categories.</p>`:'<div class="empty-state">Close your first operating week to generate cash-flow history. Cash-flow items made before closing are shown in the in-progress row.</div>'}<p class="footnote">This is a simulated direct-method statement. Its categories depend on the game's journal classifier; verify the reconciliation row and review the general journal for unusual transactions.</p></div>`;

function processLoanInstallment(report,currentTermInterest=0,loanId=null){

 if(!targets.length)return {due:0,paid:0,unpaid:0};
 const totals={due:0,paid:0,unpaid:0};
 for(const loan of targets){
  if(loan.loanBalance<=0||loan.loanWeeksRemaining<=0||loan.loanWeeklyPayment<=0||loan.loanStatus==='defaulted')continue;
  const termInterest=targets.length===1?currentTermInterest:0;
  const finalWeek=loan.loanWeeksRemaining===1;
  const scheduledInterestDue=roundMoneyValue(finalWeek?loan.loanInterestPayable:Math.min(loan.loanInterestPayable,Math.max(0,termInterest)));
  const scheduledPrincipalDue=roundMoneyValue(finalWeek?loan.loanBalance:Math.min(loan.loanBalance,Math.max(0,loan.loanWeeklyPayment-scheduledInterestDue)));
  const due=roundMoneyValue(scheduledInterestDue+scheduledPrincipalDue);const paid=roundMoneyValue(Math.min(game.cash,due));
  const interestPaid=roundMoneyValue(Math.min(paid,scheduledInterestDue));
  if(interestPaid>0){makeEntry(`Scheduled term-loan interest payment — ${loan.name}`,[{account:'Loan interest payable',debit:interestPaid},{account:'Cash',credit:interestPaid}]);loan.loanInterestPayable=roundMoneyValue(Math.max(0,loan.loanInterestPayable-interestPaid));}

  if(unpaidInterest>0||unpaidPrincipal>0){loan.loanArrearsInterest=roundMoneyValue(loan.loanArrearsInterest+unpaidInterest);loan.loanArrearsPrincipal=roundMoneyValue(loan.loanArrearsPrincipal+unpaidPrincipal);loan.loanMissedPayments++;}

  if(feeBase>0.01){const fee=roundMoneyValue(Math.min(localModelAmount(5000),feeBase*0.015));if(fee>0){loan.loanLateFeesPayable=roundMoneyValue(loan.loanLateFeesPayable+fee);report.other=roundMoneyValue(report.other+fee);game.totals.other=roundMoneyValue(game.totals.other+fee);makeEntry(`Assess late fee — ${loan.name}`,[{account:'Loan late fee expense',debit:fee},{account:'Loan late fees payable',credit:fee}]);}}
  if(loan.loanDelinquencyWeeks>=4)markLoanDefault(`${loan.loanDelinquencyWeeks} consecutive weeks of unpaid obligations`,loan.id);

  if(loan.loanBalance<=0.01)loan.loanBalance=0;
  if(loan.loanBalance===0&&loan.loanInterestPayable===0&&loan.loanArrears===0&&loan.loanLateFeesPayable===0){loan.loanStatus='paid_off';loan.loanAnnualRate=0;loan.loanWeeklyPayment=0;loan.loanWeeksRemaining=0;}
  else if(loan.loanStatus!=='defaulted')loan.loanStatus=hasPastDue?'past_due':'current';

function restartGame(){requestConfirm('Start a new company? Export your current save first if you want to keep it. The saved company on this browser will be replaced.',()=>{try{localStorage.removeItem(SAVE_KEY)}catch(e){}game=null;$('#app').classList.add('hidden');setSetup()},{title:'Start a new company?',confirmLabel:'Start new company',danger:true})}
function exportCSV(){const cashFlowByWeek=new Map((game.cashFlowHistory||[]).map(x=>[x.week,x]));const c=String(game.currencyCode||'PHP').toLowerCase();const rows=[['week','date',`revenue_${c}`,`cogs_${c}`,`rent_${c}`,`utilities_${c}`,`payroll_${c}`,`marketing_${c}`,`other_${c}`,`interest_${c}`,`depreciation_${c}`,`asset_disposal_gain_${c}`,`asset_disposal_loss_${c}`,`tax_${c}` ,`net_${c}`,'units','stockouts',`cash_received_from_customers_${c}`,`operating_cash_payments_${c}`,`net_operating_cash_flow_${c}`,`net_investing_cash_flow_${c}`,`net_financing_cash_flow_${c}`,`net_cash_change_${c}`,`period_opening_cash_${c}`,`period_closing_cash_${c}`,`cash_flow_variance_${c}`],...game.history.map(x=>{const f=cashFlowByWeek.get(x.week);return [x.week,x.date,x.revenue,x.cogs,x.rent,x.utilities,x.payroll,x.marketing,x.other,x.interest,x.depreciation,x.assetDisposalGain||0,x.assetDisposalLoss||0,x.tax,x.net,x.units,x.stockouts,f?f.operatingIn:'',f?f.operatingOut:'',f?roundMoneyValue(f.operatingIn-f.operatingOut):'',f?roundMoneyValue(f.investingIn-f.investingOut):'',f?roundMoneyValue(f.financingIn-f.financingOut):'',f?cashFlowNet(f):'',f&&typeof f.openingCash==='number'?f.openingCash:'',f&&typeof f.closingCash==='number'?f.closingCash:'',f&&typeof f.variance==='number'?f.variance:'']})];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`${game.company.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-weekly-history.csv`);notify('Weekly financial and tracked cash-flow history exported.')}
function showServiceEconomics(id){const p=getProduct(id);if(!p)return;const contribution=p.price-p.unitCost;notify(`${p.name}: contribution ${money(contribution)} per delivery before payroll, rent, marketing, and tax.`)}
function updateRoleDetail(){const idx=Number($('#role-select')?.value||0);const r=getIndustry().roles[idx];if(r)$('#role-detail').innerHTML=`${esc(r.description)} One-time onboarding: <strong>${money(r.onboard)}</strong>. Monthly salary: <strong>${money(r.salary)}</strong>.`}
// Centralized click handling keeps the project simple to host as a single static HTML file.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){navSet(nav.dataset.view);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;if(game&&game.companyStatus==='bankrupt'&&!['export-save','export-csv','restart','import-save','toggle-cashflow-history'].includes(a)){notify('This company is closed. You can export reports or start a new company.','error');return}switch(a){case'advance-week':requestConfirm(`Close week ${game.week} and process sales, payroll accrual, supplier terms, financing costs, taxes, and market events?`,runWeek,{title:'Close operating week?',confirmLabel:'Close week'});break;case'export-save':exportSave();break;case'import-save':importSave();break;case'restart':restartGame();break;case'save-price':savePrice(btn.dataset.id);break;case'order-stock':orderStock(btn.dataset.id);break;case'hire-employee':hireEmployee();break;case'fire-employee':fireEmployee(btn.dataset.id);break;case'set-marketing-baseline':game.marketingBudget=game.baselineMarketing;saveGame(true);renderAll();notify('Baseline marketing budget restored.');break;case'buy-insurance':addInsurance();break;case'activate-license':activateLicense();break;case'adjust-tax':adjustTax();break;case'complete-country-task':completeCountryRuleTask(btn.dataset.task);break;case'toggle-cashflow-history':cashFlowExpanded=!cashFlowExpanded;renderView();break;case'select-asset-for-disposal':{const asset=activeFixedAssets().find(a=>a.id===btn.dataset.id);if(asset){const select=$('#asset-disposal-id'),proceeds=$('#asset-disposal-proceeds');if(select)select.value=asset.id;if(proceeds)proceeds.value=assetBookValue(asset).toFixed(2);$('#asset-disposal-form')?.scrollIntoView({behavior:'smooth',block:'center'});if(select)select.focus()}break;}case'export-csv':exportCSV();break;case'service-info':showServiceEconomics(btn.dataset.id);break;}});
document.addEventListener('change',e=>{if(e.target.id==='role-select')updateRoleDetail();if(e.target.id==='import-file'&&e.target.files&&e.target.files[0]){importSaveFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();if(game&&game.companyStatus==='bankrupt'){notify('This company is closed. Export reports or start a new company.','error');return}switch(form.dataset.form){case'marketing':setMarketing();break;case'market-strategy':setMarketStrategy($('#market-strategy')?.value||'balanced');break;case'capital-injection':injectCapital();break;case'loan':loanRequest();break;case'loan-repayment':{const amountInput=form.querySelector('input[name="amount"]');repayLoan(amountInput?amountInput.value:undefined,form.dataset.loanId||null);break}case'loan-arrears-payment':{const amountInput=form.querySelector('input[name="amount"]');payLoanArrears(amountInput?amountInput.value:undefined,form.dataset.loanId||null);break}case'fixed-asset-purchase':purchaseFixedAsset();break;case'asset-disposal':{const assetId=$('#asset-disposal-id')?.value;const proceeds=Number($('#asset-disposal-proceeds')?.value);const asset=activeFixedAssets().find(a=>a.id===assetId);if(!asset){notify('Choose an active asset to dispose of.','error');return}if(!Number.isFinite(proceeds)||proceeds<0||proceeds>localModelAmount(100000000)){notify(`Sale proceeds must be between ${moneyExact(0)} and ${moneyExact(localModelAmount(100000000))}.`,'error');return}const bookValue=assetBookValue(asset);const gain=roundMoneyValue(Math.max(0,proceeds-bookValue));const loss=roundMoneyValue(Math.max(0,bookValue-proceeds));requestConfirm(`Dispose of ${asset.name}? Sale proceeds: ${moneyExact(proceeds)}. Current net book value: ${moneyExact(bookValue)}. ${gain>0?`Estimated gain: ${moneyExact(gain)} before tax.`:loss>0?`Estimated loss: ${moneyExact(loss)}.`:'No gain or loss is expected.'} This action cannot be undone.`,()=>disposeFixedAsset(assetId,proceeds),{title:'Confirm asset sale / disposal',confirmLabel:proceeds>0?'Confirm disposal':'Write off asset',danger:true});break;}}});
// Render the selected industry role description after returning to the People screen.
const observer=new MutationObserver(()=>{if(activeView==='people')updateRoleDetail()});observer.observe($('#view'),{childList:true});
window.addEventListener('beforeunload',()=>saveGame(true));
(function boot(){let found=false,invalidReason='';try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const parsed=JSON.parse(raw);const wasLegacy=!Object.prototype.hasOwnProperty.call(parsed,'saveFormat')&&parsed.version===1;const wasPriorEnvelope=parsed.saveFormat===SAVE_FORMAT_NAME&&[2,3,4,5,6,7].includes(parsed.saveFormatVersion);game=validateSaveCandidate(parsed);if(!game.companyStatus)game.companyStatus='active';if(wasLegacy||wasPriorEnvelope){const backupKey=wasLegacy?SAVE_KEY+'-pre-centavo-backup':SAVE_KEY+'-pre-v8-backup';try{if(!localStorage.getItem(backupKey))localStorage.setItem(backupKey,raw)}catch(backupError){/* Best-effort safety copy; continue if storage is full. */}}found=true}}catch(e){invalidReason=e&&e.message?e.message:'Unreadable local save';try{const raw=localStorage.getItem(SAVE_KEY);if(raw)localStorage.setItem(SAVE_KEY+'-rejected-backup',raw);localStorage.removeItem(SAVE_KEY)}catch(storageError){}}if(found)openGame();else{game=null;setSetup();if(invalidReason)notify(`The browser save failed integrity checks (${invalidReason}). It was isolated as a backup; start a new company or import a known-good save.`,'error')}})();
</script>
</body>
