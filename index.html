function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n,compact=false){n=Number(n)||0;const abs=Math.abs(n);let v;if(compact&&abs>=1e6)v='₱'+(n/1e6).toFixed(2)+'m';else if(compact&&abs>=1e4)v='₱'+(n/1e3).toFixed(1)+'k';else v='₱'+Math.round(n).toLocaleString('en-PH');return v}
function signedMoney(n){return (n>0?'+':n<0?'−':'')+money(Math.abs(n))}
function pct(n,places=0){return (n*100).toFixed(places)+'%'}
function dateLabel(iso,format='short'){let d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-PH',format==='long'?{year:'numeric',month:'long',day:'numeric'}:{month:'short',day:'2-digit',year:'numeric'})}
function addDays(iso,days){let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function fmtNum(n){return (Number(n)||0).toLocaleString('en-PH',{maximumFractionDigits:1})}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function makeEntry(memo,lines){const clean=lines.filter(x=>Math.abs(x.debit||0)>.004||Math.abs(x.credit||0)>.004).map(x=>({account:x.account,debit:Math.round((x.debit||0)*100)/100,credit:Math.round((x.credit||0)*100)/100}));if(!clean.length)return;const dr=clean.reduce((a,x)=>a+x.debit,0),cr=clean.reduce((a,x)=>a+x.credit,0);if(Math.abs(dr-cr)>.1){console.warn('Unbalanced journal entry',memo,dr,cr);game.integrityWarnings=(game.integrityWarnings||0)+1;}game.journal.unshift({date:game.date,week:game.week,memo,lines:clean,total:Math.max(dr,cr)});if(game.journal.length>600)game.journal.length=600;}

function balanceSheet(){const assets=game.cash+game.ar+game.products.reduce((a,p)=>a+(p.stockValue||0),0)+game.equipment-Math.min(game.equipment,game.accumDep)+game.deposit;const liabilities=game.ap+game.rentPayable+game.utilityPayable+game.payrollPayable+game.taxPayable+game.interestPayable+game.loanBalance+game.overdraft;const equity=game.capital+game.retainedEarnings-game.drawings;return {assets,liabilities,equity,delta:assets-liabilities-equity,cash:game.cash,inventory:game.products.reduce((a,p)=>a+(p.stockValue||0),0),equipment:game.equipment-Math.min(game.equipment,game.accumDep),receivables:game.ar,deposit:game.deposit}}
function receiveCash(amount){amount=Math.max(0,amount);const debtPay=Math.min(game.overdraft,amount);game.overdraft-=debtPay;const added=amount-debtPay;game.cash+=added;return {cashAdded:added,overdraftPaid:debtPay}}
function spendCash(amount){amount=Math.max(0,amount);const fromCash=Math.min(game.cash,amount);game.cash-=fromCash;const borrowed=amount-fromCash;if(borrowed>0)game.overdraft+=borrowed;return {cashUsed:fromCash,overdraftDrawn:borrowed}}
function receiptJournal(memo,amount,account='Revenue',arAdded=0){const r=receiveCash(amount-arAdded);const lines=[];if(r.cashAdded)lines.push({account:'Cash',debit:r.cashAdded});if(r.overdraftPaid)lines.push({account:'Bank overdraft',debit:r.overdraftPaid});if(arAdded)lines.push({account:'Accounts receivable',debit:arAdded});lines.push({account,credit:amount});makeEntry(memo,lines);}
function payJournal(memo,amount,debitAccount){const s=spendCash(amount);const lines=[{account:debitAccount,debit:amount}];if(s.cashUsed)lines.push({account:'Cash',credit:s.cashUsed});if(s.overdraftDrawn)lines.push({account:'Bank overdraft',credit:s.overdraftDrawn});makeEntry(memo,lines);return s}

max(5,p.baseDemand*.7)?'<div class="status-line"><span class="status-dot warn"></span>Low stock: consider supplier lead times.</div>':''}</article>`}).join('')}</div>
 <div class="grid two-col section-spacer"><section class="panel"><div class="panel-header"><h3>Supplier terms</h3><span class="tag">Net-7 model</span></div><div class="list-row"><span><span class="row-title">Paid on order</span><div class="row-sub">Cash or overdraft when the purchase is placed</div></span><span class="row-value">70%</span></div><div class="list-row"><span><span class="row-title">Supplier credit</span><div class="row-sub">Remaining balance due next operating week</div></span><span class="row-value">30%</span></div><div class="list-row"><span><span class="row-title">Inventory valuation</span><div class="row-sub">Weighted-average purchase cost</div></span><span class="row-value">WAC</span></div><p class="footnote" style="margin:12px 0 0">This is a simplified supplier contract model. It does not represent actual terms offered by any real supplier.</p></section><section class="panel"><div class="panel-header"><h3>Capacity & quality</h3><span class="tag">Operations</span></div><div class="list-row"><span class="row-title">Owner baseline capacity</span><span class="row-value num">${fmtNum(cfg.baseCapacity)}</span></div><div class="list-row"><span class="row-title">Employee capacity</span><span class="row-value num">+${fmtNum(game.employees.reduce((a,e)=>a+e.capacity,0))}</span></div><div class="list-row"><span class="row-title">Customer reputation</span><span class="row-value num">${Math.round(game.reputation)} / 100</span></div><div class="bar"><span style="width:${game.reputation}%"></span></div><div class="status-line">${game.reputation>=75?'Service reliability is a competitive advantage.':game.reputation>=50?'Consistent fulfilment can grow trust.':'Low trust makes customer acquisition harder.'}</div></section></div>`}
function renderMarket(){const demandFactor=1+Math.sqrt(Math.max(0,game.marketingBudget)/Math.max(1,game.baselineMarketing))*.12;const d=clamp(game.economy*(.68+game.reputation/190)*demandFactor,.35,1.65);return `<div class="page-head"><div><div class="eyebrow">Market · customers · pricing</div><h1>Market & sales</h1><p>Demand depends on the wider economy, price competitiveness, reputation, marketing, and the capacity to fulfil orders. More demand can still be unprofitable if contribution margins are weak.</p></div><span class="tag">Simulated market · Week ${game.week}</span></div>

function renderPeople(){const cfg=getIndustry();const payrollMonthly=game.employees.reduce((a,e)=>a+e.salary,0);const payrollWeekly=payrollMonthly*7/MONTH_DAYS;return `<div class="page-head"><div><div class="eyebrow">People · labour commitments</div><h1>People & staffing</h1><p>Employees add capacity and capability, but wages are recurring obligations. The simulation accrues payroll throughout the month and pays it at month-end.</p></div><span class="tag">${game.employees.length} active employee${game.employees.length===1?'':'s'}</span></div>

 game.products.forEach(p=>{p.competitorPrice=clamp(p.competitorPrice*(1+(Math.random()-.5)*.018),p.refPrice*.55,p.refPrice*1.65);p.unitCost=clamp(p.unitCost*(1+(Math.random()*.004-.001)),p.cost*.9,p.cost*1.35)});
 if(totalPotential>0){const fulfilment=totalSold/totalPotential;if(fulfilment<.7)game.reputation=clamp(game.reputation-1.15,0,100);else if(fulfilment>.92)game.reputation=clamp(game.reputation+.5,0,100);else game.reputation=clamp(game.reputation-.05,0,100)}
 const fixedStress=game.cash<game.monthlyRent*.55||game.overdraft>0;if(fixedStress){game.distressWeeks++;game.creditScore=clamp(game.creditScore-1.4,20,95)}else{game.distressWeeks=Math.max(0,game.distressWeeks-1);game.creditScore=clamp(game.creditScore+(report.net>=0?.45:-.4),20,95)}if(game.complianceScore<50)game.creditScore=clamp(game.creditScore-.2,20,95);
 if(game.cash<game.monthlyRent*.7&&game.distressWeeks>=3){game.reputation=clamp(game.reputation-.4,0,100);}
 game.history.push(report);if(game.history.length>104)game.history.shift();game.lastWeek=report;game.date=nextDate;game.dayCount+=7;game.week+=1;
 game.notes.unshift({week:report.week,date:report.date,summary:`Revenue ${money(report.revenue)}, net result ${signedMoney(report.net)}, ${report.units} units served.`});if(game.notes.length>50)game.notes.length=50;
 saveGame(true);renderAll();if(report.net<0)notify(`Week ${report.week} closed. Net result: ${signedMoney(report.net)}. Review cash and fixed obligations.`, 'warn');else notify(`Week ${report.week} closed. Net result: ${signedMoney(report.net)}.`);}
function savePrice(id){const p=getProduct(id);const input=$(`#price-${id}`);if(!p||!input)return;const value=Number(input.value);if(!Number.isFinite(value)||value<=0||value>100000000){notify('Enter a valid positive selling price.','error');return}p.price=Math.round(value*100)/100;saveGame(true);renderAll();const avg=p.kind==='goods'&&p.stock?p.stockValue/p.stock:p.unitCost;if(p.price<avg)notify('Price saved below current variable cost. Each sale may destroy value.','warn');else notify('Selling price updated.')}
function orderStock(id){const p=getProduct(id);if(!p||p.kind!=='goods')return;const input=$(`#order-${id}`);const qty=Math.round(Number(input?.value));if(!Number.isFinite(qty)||qty<1||qty>2000){notify('Choose an order quantity from 1 to 2,000 units.','error');return}const cost=qty*p.unitCost;const cashPart=cost*.7;const paid=spendCash(cashPart);game.ap+=cost*.3;p.stockValue+=cost;p.stock+=qty;const lines=[{account:'Inventory',debit:cost}];if(paid.cashUsed)lines.push({account:'Cash',credit:paid.cashUsed});if(paid.overdraftDrawn)lines.push({account:'Bank overdraft',credit:paid.overdraftDrawn});lines.push({account:'Accounts payable',credit:cost*.3});makeEntry(`Purchase inventory — ${p.name} (${qty} units)`,lines);saveGame(true);renderAll();notify(`Ordered ${qty} units. Total purchase ${money(cost)}; ${money(cost*.3)} payable next week.`,paid.overdraftDrawn?'warn':'')}
function hireEmployee(){const cfg=getIndustry();const idx=Number($('#role-select')?.value||0);const role=cfg.roles[idx];if(!role)return;if(game.employees.length>=20){notify('This scenario caps the team at 20 employees.','error');return}const emp={id:'emp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5),name:role.name,role:role.name,icon:role.icon,salary:role.salary,onboard:role.onboard,capacity:role.capacity,hired:game.date};payJournal(`Recruitment and onboarding — ${role.name}`,role.onboard,'Recruitment expense');game.retainedEarnings-=role.onboard;game.totals.other+=role.onboard;game.totals.net-=role.onboard;game.employees.push(emp);saveGame(true);renderAll();notify(`${role.name} hired. Monthly payroll increases by ${money(role.salary)}.`)}
function fireEmployee(id){const idx=game.employees.findIndex(e=>e.id===id);if(idx<0)return;const e=game.employees[idx];const confirmMsg=`End employment for ${e.role}? This reduces future payroll but also removes the role's capacity. Any real-world notice, severance, or employment obligations are not modeled.`;if(!window.confirm(confirmMsg))return;game.employees.splice(idx,1);saveGame(true);renderAll();notify(`${e.role} removed from your team. Review capacity and payroll commitments.`)}
function setMarketing(){const val=Number($('#marketing-budget')?.value);if(!Number.isFinite(val)||val<0||val>1000000){notify('Marketing budget must be from ₱0 to ₱1,000,000 per week.','error');return}game.marketingBudget=Math.round(val);saveGame(true);renderAll();notify('Weekly marketing budget updated.')}
function loanRequest(){const input=$('#loan-amount');const amount=Math.round(Number(input?.value));if(!Number.isFinite(amount)||amount<10000){notify('Loan requests must be at least ₱10,000.','error');return}if(game.loanBalance>0){notify('Repay the existing term loan before requesting another.','error');return}const max=Math.max(50000,game.capital*.45+game.cash*.35);if(amount>max){notify(`Request declined by the model. Current simplified limit: ${money(max)}.`, 'error');return}if(game.creditScore<30){notify('Request declined: current simulated credit score is too weak.','error');return}const annual=clamp(.12+(72-game.creditScore)*.002+(game.overdraft>0?.05:0)+(game.distressWeeks>1?.025:0),.105,.29);const rec=receiveCash(amount);game.loanBalance=amount;game.loanAnnualRate=annual;const lines=[];if(rec.cashAdded)lines.push({account:'Cash',debit:rec.cashAdded});if(rec.overdraftPaid)lines.push({account:'Bank overdraft',debit:rec.overdraftPaid});lines.push({account:'Term loan payable',credit:amount});makeEntry('Term loan drawdown',lines);const fee=amount*.02;payJournal('Loan origination fee',fee,'Financing fee expense');game.retainedEarnings-=fee;game.totals.other+=fee;game.totals.net-=fee;saveGame(true);renderAll();notify(`Financing approved at an illustrative ${pct(annual,1)} annual rate. Principal is a liability, not revenue.`,'warn')}
function repayLoan(){const amount=Math.min(game.loanBalance,Math.round(Number($('#loan-repay')?.value)||0));if(amount<=0){notify('Enter a principal payment amount.','error');return}if(amount>game.cash){notify('Payment exceeds available cash. Preserve liquidity or inject capital first.','error');return}payJournal('Term loan principal repayment',amount,'Term loan payable');game.loanBalance-=amount;if(game.loanBalance<.01){game.loanBalance=0;game.loanAnnualRate=0}saveGame(true);renderAll();notify(`Principal payment of ${money(amount)} recorded.`)}
function injectCapital(){const amount=Math.round(Number($('#capital-injection')?.value));if(!Number.isFinite(amount)||amount<1000||amount>100000000){notify('Enter an injection between ₱1,000 and ₱100,000,000.','error');return}const rec=receiveCash(amount);game.capital+=amount;const lines=[];if(rec.cashAdded)lines.push({account:'Cash',debit:rec.cashAdded});if(rec.overdraftPaid)lines.push({account:'Bank overdraft',debit:rec.overdraftPaid});lines.push({account:'Owner capital',credit:amount});makeEntry('Additional owner capital contribution',lines);saveGame(true);renderAll();notify(`${money(amount)} in additional owner capital recorded.`)}
function addInsurance(){if(game.insuranceActive){notify('Insurance is already active.');return}game.insuranceActive=true;game.complianceScore=clamp(game.complianceScore+5,0,100);saveGame(true);renderAll();notify('Basic modeled coverage activated. The weekly premium begins when you close the next week.')}
function activateLicense(){if(game.licenseActive){notify('Core licence status is already active.');return}const cost=5000;if(game.cash<cost){notify(`You need at least ${money(cost)} available cash.`, 'error');return}payJournal('Licence reactivation fee',cost,'Licensing and permit expense');game.retainedEarnings-=cost;game.totals.other+=cost;game.totals.net-=cost;game.licenseActive=true;game.complianceScore=clamp(game.complianceScore+8,0,100);saveGame(true);renderAll();notify('Modeled licence status reactivated.')}
function adjustTax(){const answer=window.prompt('Set an illustrative income-tax reserve rate as a percentage (5 to 40). This is a game assumption, not the legal tax rate for your location.',String(Math.round(game.taxRate*100)));if(answer===null)return;const v=Number(answer);if(!Number.isFinite(v)||v<5||v>40){notify('Choose a value from 5 to 40.','error');return}game.taxRate=v/100;saveGame(true);renderAll();notify(`Illustrative tax reserve set to ${v}%.`,'warn')}
function exportSave(){if(!game)return;const data=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});downloadBlob(data,`realworld-save-week-${game.week}.json`);notify('Save file exported. Keep it private if it includes your company notes.')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importSave(){const file=$('#import-file');if(file)file.click()}
function importSaveFile(file){const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed.company||!parsed.industry||!INDUSTRIES[parsed.industry]||!Array.isArray(parsed.products)||!parsed.totals)throw new Error('not a game save');game=parsed;saveGame(true);openGame();notify('Game save imported successfully.')}catch(e){notify('That file is not a compatible REALWORLD game save.','error')}};reader.readAsText(file)}
function restartGame(){if(!window.confirm('Start a new company? Export your current save first if you want to keep it. A new game will replace the saved company on this device.'))return;try{localStorage.removeItem(SAVE_KEY)}catch(e){}game=null;$('#app').classList.add('hidden');setSetup()}
function exportCSV(){const rows=[['week','date','revenue_php','cogs_php','rent_php','utilities_php','payroll_php','marketing_php','other_php','interest_php','depreciation_php','tax_php','net_php','units','stockouts'],...game.history.map(x=>[x.week,x.date,x.revenue,x.cogs,x.rent,x.utilities,x.payroll,x.marketing,x.other,x.interest,x.depreciation,x.tax,x.net,x.units,x.stockouts])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`${game.company.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-weekly-history.csv`);notify('Weekly history CSV exported.')}
function showServiceEconomics(id){const p=getProduct(id);if(!p)return;const contribution=p.price-p.unitCost;notify(`${p.name}: contribution ${money(contribution)} per delivery before payroll, rent, marketing, and tax.`)}
function updateRoleDetail(){const idx=Number($('#role-select')?.value||0);const r=getIndustry().roles[idx];if(r)$('#role-detail').innerHTML=`${esc(r.description)} One-time onboarding: <strong>${money(r.onboard)}</strong>. Monthly salary: <strong>${money(r.salary)}</strong>.`}
// Centralized click handling keeps the project simple to host as a single static HTML file.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){navSet(nav.dataset.view);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;switch(a){case'advance-week':if(window.confirm(`Close week ${game.week} and process sales, payroll accrual, supplier terms, financing costs, taxes, and market events?`))runWeek();break;case'export-save':exportSave();break;case'import-save':importSave();break;case'restart':restartGame();break;case'save-price':savePrice(btn.dataset.id);break;case'order-stock':orderStock(btn.dataset.id);break;case'hire-employee':hireEmployee();break;case'fire-employee':fireEmployee(btn.dataset.id);break;case'set-marketing-baseline':game.marketingBudget=game.baselineMarketing;saveGame(true);renderAll();notify('Baseline marketing budget restored.');break;case'buy-insurance':addInsurance();break;case'activate-license':activateLicense();break;case'adjust-tax':adjustTax();break;case'export-csv':exportCSV();break;case'service-info':showServiceEconomics(btn.dataset.id);break;}});
document.addEventListener('change',e=>{if(e.target.id==='role-select')updateRoleDetail();if(e.target.id==='import-file'&&e.target.files&&e.target.files[0]){importSaveFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();switch(form.dataset.form){case'marketing':setMarketing();break;case'capital-injection':injectCapital();break;case'loan':loanRequest();break;case'loan-repayment':repayLoan();break;}});
// Render the selected industry role description after returning to the People screen.
const observer=new MutationObserver(()=>{if(activeView==='people')updateRoleDetail()});observer.observe($('#view'),{childList:true});
window.addEventListener('beforeunload',()=>saveGame(true));
(function boot(){let found=false;try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.company&&INDUSTRIES[parsed.industry]&&Array.isArray(parsed.products)){game=parsed;found=true}}}catch(e){}if(found)openGame();else setSetup()})();
</script>
</body>
</html>
