name: REALWORLD Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'layer*.js'
      - 'layer*.test.cjs'
      - 'loader.test.cjs'
      - 'regression.test.cjs'
      - '.github/workflows/realworld-regression.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Layer 7, Layer 8.2, Layer 9, Layer 10, and loader tests
        run: >-
          node --test
          layer7.test.cjs
          layer8.2.test.cjs
          layer9.test.cjs
          layer10.test.cjs
          loader.test.cjs

      - name: Run existing business-engine regressions against pinned Layer 6.0 source
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          cp index.html "$backup"
          restore() { cp "$backup" index.html; rm -f "$backup"; }
          trap restore EXIT
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/saludariomelven-boop/realworld-business-sim/cca64607926733ee0d1130138606b2753a67dd99/index.html' \
            --output index.html
          node --test regression.test.cjs

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in layer7.js layer8.2.js layer9.js layer10.js \
            layer7.test.cjs layer8.2.test.cjs layer9.test.cjs \
            layer10.test.cjs loader.test.cjs regression.test.cjs; do
            node --check "$file"
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('index.html', 'utf8');
          const match = source.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Expected one bootstrap script in index.html');
          fs.writeFileSync('/tmp/realworld-layer10-bootstrap.js', match[1]);
          NODE

          node --check /tmp/realworld-layer10-bootstrap.js
