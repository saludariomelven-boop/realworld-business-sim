#!/usr/bin/env bash
set -euo pipefail

REPO_ROOT="$(git rev-parse --show-toplevel)"
PACKAGE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
cd "$REPO_ROOT"

SOURCE_COMMIT="f63c74396ffe93d2b6ac75775833d22f8f2cb63d"
git fetch origin "$SOURCE_COMMIT"
git restore --source="$SOURCE_COMMIT" -- layer8.3.js layer8.3.test.cjs
install -D "$PACKAGE_DIR/.github/workflows/realworld-regression.yml" .github/workflows/realworld-regression.yml

node --check layer8.3.js
node --check layer8.3.test.cjs
node --check layer9.js
node --check layer9.test.cjs
node --test loader.test.cjs layer7.test.cjs layer8.2.test.cjs layer8.3.test.cjs layer9.test.cjs

echo
echo "Repair staged in working tree. Review with: git diff --stat && git diff -- .github/workflows/realworld-regression.yml"
echo "Commit the three file changes together only after the checks above pass."
